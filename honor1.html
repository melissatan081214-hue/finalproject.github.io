<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet">

<title>王者荣耀 · 英雄图鉴</title>

<style>

/* =====================================================
   基础
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#08090d;
    color:#fff;
    font-family:"Noto Sans SC","Microsoft YaHei",Arial,sans-serif;
}

button{
    font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;
}


/* =====================================================
   英雄图鉴页面
===================================================== */

.hero-page{
    min-height:100vh;

    background:
    radial-gradient(
        circle at 50% 20%,
        rgba(180,150,80,.12),
        transparent 35%
    ),
    linear-gradient(
        180deg,
        #15171d,
        #08090d 60%
    );

    padding:80px 8%;
}


/* =====================================================
   标题
===================================================== */

.header{
    text-align:center;
    margin-bottom:55px;
}

.header-small{
    color:#cdb56d;
    font-size:13px;
    letter-spacing:8px;
    margin-bottom:18px;
}

.header h1{
    font-family:"Noto Serif SC","Microsoft YaHei",serif;
    font-size:52px;
    font-weight:500;
    letter-spacing:15px;
}

.header-line{
    width:80px;
    height:1px;
    background:#cdb56d;
    margin:25px auto;
}


/* =====================================================
   分类按钮
===================================================== */

.category{
    display:flex;
    justify-content:center;
    gap:15px;
    margin-bottom:65px;
    flex-wrap:wrap;
}

.category button{
    min-width:110px;
    padding:14px 28px;

    border:1px solid rgba(255,255,255,.2);

    background:rgba(255,255,255,.03);

    color:rgba(255,255,255,.65);

    cursor:pointer;

    font-size:14px;
    letter-spacing:3px;

    transition:.35s;
}

.category button:hover{
    color:#d8bd70;
    border-color:#d8bd70;
}

.category button.active{
    color:#111;
    background:#d8bd70;
    border-color:#d8bd70;
}


/* =====================================================
   英雄列表
===================================================== */

.hero-grid{
    max-width:1100px;
    margin:auto;

    display:grid;

    grid-template-columns:
    repeat(4,1fr);

    gap:20px;
}


/* =====================================================
   英雄卡片
===================================================== */

.hero-card{
    position:relative;

    height:420px;

    overflow:hidden;

    cursor:pointer;

    border:1px solid rgba(255,255,255,.12);

    background:#15161b;

    transition:.45s;

    animation:cardIn .6s ease;
}

.hero-card:hover{
    transform:translateY(-12px);

    border-color:#d8bd70;

    box-shadow:
    0 20px 50px
    rgba(0,0,0,.6);
}


/* =====================================================
   英雄图片
===================================================== */

.hero-image{
    width:100%;
    height:100%;

    position:relative;

    overflow:hidden;

    background:#202127;
}

.hero-image img{
    width:100%;
    height:100%;

    object-fit:cover;

    display:block;

    transition:.6s;
}

.hero-card:hover .hero-image img{
    transform:scale(1.08);
}


/* =====================================================
   图片底部渐变
===================================================== */

.hero-card::after{
    content:"";

    position:absolute;

    left:0;
    right:0;
    bottom:0;

    height:55%;

    background:
    linear-gradient(
        transparent,
        rgba(0,0,0,.95)
    );

    pointer-events:none;
}


/* =====================================================
   英雄资料
===================================================== */

.hero-info{
    position:absolute;

    left:25px;
    bottom:25px;

    z-index:2;
}

.hero-position{
    color:#d8bd70;

    font-size:12px;

    letter-spacing:3px;

    margin-bottom:8px;
}

.hero-name{
    font-family:"Noto Serif SC",serif;
    font-size:30px;
    letter-spacing:6px;
    font-weight:500;
    transition:.3s;
}

.hero-en{
    font-size:10px;

    letter-spacing:3px;

    color:rgba(255,255,255,.4);

    margin-top:7px;
	font-family:"Cinzel",serif;
}

.hero-card:hover .hero-name{
    color:#d8bd70;
}


/* =====================================================
   详情页
===================================================== */

.hero-detail{
    display:none;

    min-height:100vh;

    background:
    radial-gradient(
        circle at 50% 20%,
        rgba(180,150,80,.12),
        transparent 35%
    ),
    #08090d;
}


/* =====================================================
   返回按钮
===================================================== */

.back-button{
    position:fixed;

    top:30px;
    left:30px;

    z-index:100;

    padding:12px 22px;

    background:rgba(0,0,0,.45);

    border:1px solid rgba(255,255,255,.2);

    color:#fff;

    cursor:pointer;

    letter-spacing:2px;

    transition:.3s;
}

.back-button:hover{
    color:#d8bd70;
    border-color:#d8bd70;
}


/* =====================================================
   详情 Hero
===================================================== */

.detail-hero{
    min-height:650px;

    position:relative;

    display:flex;

    align-items:center;

    overflow:hidden;
}

.detail-bg{
    position:absolute;

    inset:0;

    background-position:center;
    background-size:cover;

    filter:brightness(.45);

    transform:scale(1.05);
}

.detail-bg::after{
    content:"";

    position:absolute;

    inset:0;

    background:
    linear-gradient(
        90deg,
        rgba(8,9,13,.95),
        rgba(8,9,13,.35),
        rgba(8,9,13,.85)
    );
}

.detail-content{
    position:relative;

    z-index:2;

    width:100%;

    max-width:1200px;

    margin:auto;

    padding:100px 60px;
}

.detail-position{
    color:#d8bd70;

    letter-spacing:6px;

    font-size:13px;

    margin-bottom:15px;
}

.detail-name{
    font-family:"Noto Serif SC","Microsoft YaHei",serif;
    font-size:76px;
    font-weight:500;
    letter-spacing:14px;
    margin-bottom:12px;
}

.detail-en{
    font-size:14px;

    letter-spacing:6px;

    color:rgba(255,255,255,.45);

    margin-bottom:35px;
}

.detail-quote{
    max-width:600px;

    color:rgba(255,255,255,.7);

    line-height:2;

    font-size:15px;
}


/* =====================================================
   英雄档案
===================================================== */

.profile{
    max-width:1200px;

    margin:auto;

    padding:100px 40px;
}

.section-title{
    text-align:center;

    margin-bottom:55px;
}

.section-title small{
    color:#cdb56d;

    font-size:12px;

    letter-spacing:6px;
}

.section-title h2{
    font-family:"Noto Serif SC","Microsoft YaHei",serif;
    font-size:40px;
    font-weight:500;
    letter-spacing:10px;
    margin-top:12px;
}


/* =====================================================
   档案列表
===================================================== */

.profile-box{
    max-width:1050px;

    margin:auto;

    border-top:1px solid rgba(255,255,255,.15);
}


/* 每一行 */

.profile-row{
    display:grid;

    grid-template-columns:
    90px 340px 1fr;

    align-items:center;

    min-height:85px;

    border-bottom:
    1px solid rgba(255,255,255,.15);

    transition:.3s;
}

.profile-row:hover{
    background:
    rgba(217,189,120,.06);
}


/* =====================================================
   LOGO
===================================================== */

.profile-logo{
    display:flex;

    justify-content:center;

    align-items:center;
}

.profile-logo img{
    width:52px;
    height:52px;

    object-fit:contain;

    opacity:.9;

    transition:.3s;
}

.profile-row:hover .profile-logo img{
    transform:scale(1.08);

    opacity:1;
}


/* =====================================================
   ━━━━━ 中文名 ━━━━━
===================================================== */

.profile-label{
    display:flex;

    align-items:center;

    justify-content:center;

    gap:10px;

    white-space:nowrap;
}

.profile-label i{
    display:block;

    width:55px;

    height:1px;

    background:
    linear-gradient(
        90deg,
        transparent,
        #cdb56d
    );
}

.profile-label i:last-child{
    background:
    linear-gradient(
        90deg,
        #cdb56d,
        transparent
    );
}

.profile-label span{
    color:rgba(255,255,255,.6);

    font-size:13px;

    letter-spacing:3px;
}


/* =====================================================
   英雄资料内容
===================================================== */

.profile-value{
    font-size:20px;

    font-weight:400;

    letter-spacing:2px;

    color:#fff;
}


/* =====================================================
   动画
===================================================== */

@keyframes cardIn{

    from{
        opacity:0;

        transform:translateY(30px);
    }

    to{
        opacity:1;

        transform:translateY(0);
    }

}


/* =====================================================
   手机
===================================================== */

@media(max-width:1100px){

    .hero-grid{
        grid-template-columns:
        repeat(4,1fr);
    }

}

@media(max-width:850px){

    .hero-grid{
        grid-template-columns:
        repeat(3,1fr);
    }

    .detail-name{
        font-size:55px;
    }

}

@media(max-width:600px){

    .hero-page{
        padding:60px 20px;
    }

    .header h1{
        font-size:38px;
        letter-spacing:8px;
    }

    .hero-grid{
        grid-template-columns:
        repeat(2,1fr);

        gap:12px;
    }

    .hero-card{
        height:330px;
    }

    .detail-content{
        padding:100px 30px;
    }

    .detail-name{
        font-size:45px;
        letter-spacing:6px;
    }

    .profile{
        padding:70px 15px;
    }

    .profile-row{
        grid-template-columns:
        55px 1fr;

        padding:15px 0;
    }

    .profile-label{
        justify-content:flex-start;
    }

    .profile-value{
        grid-column:2;
        margin-top:8px;
    }

    .profile-label i{
        width:25px;
    }

}

</style>
</head>

/* =====================================================
   自动生成英雄卡片
===================================================== */

const heroGrid =
document.getElementById("heroGrid");


function renderHeroes(list){

    heroGrid.innerHTML="";

    list.forEach((hero,index)=>{

        const card =
        document.createElement("div");

        card.className="hero-card";

        card.onclick=()=>{ 
         if(hero.page){
        window.location.href = hero.page;
    }
};

        card.innerHTML=`

            <div class="hero-image">

                <img
                src="${hero.image}"
                alt="${hero.name}"
                onerror="this.style.display='none'">

            </div>

            <div class="hero-info">

                <div class="hero-position">
                    ${hero.position}
                </div>

                <div class="hero-name">
                    ${hero.name}
                </div>

                <div class="hero-en">
                    ${hero.en}
                </div>

            </div>
        `;

        heroGrid.appendChild(card);

    });

}


/* =====================================================
   分类筛选
===================================================== */

function filterHero(position,button){

    document
    .querySelectorAll(".category button")
    .forEach(btn=>{
        btn.classList.remove("active");
    });

    button.classList.add("active");


    if(position==="全部"){

        renderHeroes(heroes);

    }else{

        const result =
        heroes.filter(hero=>
            hero.position===position
        );

        renderHeroes(result);

    }

}


/* =====================================================

===================================================== */

    /* Hero 背景 */

    const bg =
    document.getElementById("detailBg");

    bg.style.backgroundImage =
    `url("${hero.image}")`;


    /* 基本资料 */

    document.getElementById("detailPosition")
    .textContent=
    hero.position;


    document.getElementById("detailName")
    .textContent=
    hero.name;


    document.getElementById("detailEn")

    hero.en;


    document.getElementById("detailQuote")

    ================================================= */

    const profile =
